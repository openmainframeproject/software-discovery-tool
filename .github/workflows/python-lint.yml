name: Python Lint (Flake8)

on:
  push:
    paths:
      - 'bin/**.py'
      - '.flake8'
      - '.github/workflows/python-lint.yml'
  pull_request:
    paths:
      - 'bin/**.py'
      - '.flake8'
      - '.github/workflows/python-lint.yml'

jobs:
  flake8:
    name: Flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Flake8
        run: pip install flake8 flake8-bugbear

      - name: Run Flake8
        run: flake8 bin/
